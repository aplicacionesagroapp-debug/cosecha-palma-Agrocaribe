<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Racimos - Palma</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        button { padding: 15px 25px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; margin: 5px; }
        .btn-nfc { background-color: #27ae60; color: white; width: 100%; font-size: 18px; font-weight: bold; }
        .btn-sync { background-color: #2980b9; color: white; width: 100%; }
        .status { margin-top: 15px; font-weight: bold; color: #555; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <h2>Control Cosecha de Palma</h2>

    <div class="card">
        <button class="btn-nfc" onclick="iniciarEscaneoNFC()">EFECTUAR LECTURA NFC</button>
        <div id="status-nfc" class="status">Estado: En espera de lectura...</div>
    </div>

    <div class="card">
        <h3>Resumen Local (Hoy)</h3>
        <p>Total racimos registrados sin enviar: <span id="total-pendientes">0</span></p>
        <button class="btn-sync" onclick="sincronizarConKobo()">SINCRONIZAR DATOS CON KOBO</button>
    </div>

    <div class="card">
        <h3>Conteo por Cortero</h3>
        <table id="tabla-resumen">
            <thead>
                <tr>
                    <th>ID Cortero</th>
                    <th>Racimos</th>
                    <th>GPS Capturado</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const ASSET_ID = "a3M8LTcupevyFqnTnLYgLv";
        const KOBO_TOKEN = "a6e03ba3d149e0ca7f60fb55d2e5516ea0b85b07";

        let db;

        const request = indexedDB.open("CosechaPalmaDB", 2);
        request.onupgradeneeded = e => {
            db = e.target.result;
            if(!db.objectStoreNames.contains("registros")) {
                db.createObjectStore("registros", { keyPath: "id", autoIncrement: true });
            }
        };
        request.onsuccess = e => {
            db = e.target.result;
            actualizarInterfaz();
        };

        async function iniciarEscaneoNFC() {
            const statusDiv = document.getElementById("status-nfc");
            if (!("NDEFReader" in window)) {
                statusDiv.innerText = "Error: Navegador o dispositivo sin soporte NFC.";
                return;
            }

            try {
                const ndef = new NDEFReader();
                await ndef.scan();
                statusDiv.innerText = "Escaneando... Acerque la tarjeta NFC del cortero.";

                ndef.onreading = event => {
                    const decoder = new TextDecoder();
                    let idCortero = "DESCONOCIDO";
                    for (const record of event.message.records) {
                        idCortero = decoder.decode(record.data);
                    }
                    statusDiv.innerText = `Tag: ${idCortero}. Obteniendo GPS...`;
                    capturarUbicacionYGuardar(idCortero);
                };
            } catch (error) {
                statusDiv.innerText = "Error al activar NFC: " + error;
            }
        }

        // 2. Captura de GPS con Timeout ampliado para alta precisión
        function capturarUbicacionYGuardar(idCortero) {
            const options = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };

            navigator.geolocation.getCurrentPosition(
                pos => {
                    const registro = {
                        id_cortero: idCortero,
                        latitud: pos.coords.latitude,
                        longitud: pos.coords.longitude,
                        altitud: pos.coords.altitude || 0,
                        precision: pos.coords.accuracy || 0,
                        cantidad: 1,
                        timestamp: new Date().toISOString(),
                        sincronizado: false
                    };
                    guardarEnBDLocal(registro);
                },
                err => {
                    console.warn("GPS no obtenido:", err.message);
                    const registro = {
                        id_cortero: idCortero,
                        latitud: null,
                        longitud: null,
                        altitud: 0,
                        precision: 0,
                        cantidad: 1,
                        timestamp: new Date().toISOString(),
                        sincronizado: false
                    };
                    guardarEnBDLocal(registro);
                },
                options
            );
        }

        function guardarEnBDLocal(registro) {
            const tx = db.transaction("registros", "readwrite");
            const store = tx.objectStore("registros");
            store.add(registro);
            tx.oncomplete = () => {
                const statusGps = registro.latitud ? "con GPS OK" : "SIN GPS";
                document.getElementById("status-nfc").innerText = `¡Registrado! Cortero: ${registro.id_cortero} (${statusGps})`;
                actualizarInterfaz();
            };
        }

        function actualizarInterfaz() {
            const tx = db.transaction("registros", "readonly");
            const store = tx.objectStore("registros");
            const req = store.getAll();

            req.onsuccess = () => {
                const registros = req.result;
                document.getElementById("total-pendientes").innerText = registros.filter(r => !r.sincronizado).length;

                const conteo = {};
                registros.forEach(r => {
                    if(!r.sincronizado) {
                        if(!conteo[r.id_cortero]) conteo[r.id_cortero] = { total: 0, gpsOk: 0 };
                        conteo[r.id_cortero].total += 1;
                        if(r.latitud) conteo[r.id_cortero].gpsOk += 1;
                    }
                });

                const tbody = document.querySelector("#tabla-resumen tbody");
                tbody.innerHTML = "";
                for (const [cortero, data] of Object.entries(conteo)) {
                    tbody.innerHTML += `<tr><td>${cortero}</td><td>${data.total}</td><td>${data.gpsOk} / ${data.total}</td></tr>`;
                }
            };
        }

        // 3. Sincronización mediante Endpoint XML Directo (Evita bloqueos CORS)
        async function sincronizarConKobo() {
            const tx = db.transaction("registros", "readwrite");
            const store = tx.objectStore("registros");
            const req = store.getAll();

            req.onsuccess = async () => {
                const pendientes = req.result.filter(r => !r.sincronizado);
                if (pendientes.length === 0) {
                    alert("No hay registros pendientes por enviar.");
                    return;
                }

                let enviados = 0;
                const endpoint = `https://eu.kobotoolbox.org/submission?submission`;

                for (const item of pendientes) {
                    const gpsString = item.latitud && item.longitud 
                        ? `${item.latitud} ${item.longitud} ${item.altitud} ${item.precision}`
                        : "";

                    // Construcción del XML nativo que exige KoboToolbox
                    const xmlData = `<?xml version="1.0"?>
                    <a3M8LTcupevyFqnTnLYgLv id="a3M8LTcupevyFqnTnLYgLv">
                        <ID_CORTERO>${item.id_cortero}</ID_CORTERO>
                        <UBICACI_N_GPS_AUTOMATICA>${gpsString}</UBICACI_N_GPS_AUTOMATICA>
                        <CONTADOR_DE_RACIMOS>${item.cantidad}</CONTADOR_DE_RACIMOS>
                    </a3M8LTcupevyFqnTnLYgLv>`;

                    const formData = new FormData();
                    const blob = new Blob([xmlData], { type: "text/xml" });
                    formData.append("xml_submission_file", blob, "submission.xml");

                    try {
                        const res = await fetch(endpoint, {
                            method: "POST",
                            headers: {
                                "Authorization": "Token " + KOBO_TOKEN
                            },
                            body: formData
                        });

                        if (res.status === 201 || res.status === 200) {
                            item.sincronizado = true;
                            store.put(item);
                            enviados++;
                        } else {
                            console.error("Error en respuesta Kobo:", res.status, await res.text());
                        }
                    } catch (e) {
                        console.error("Error de red al sincronizar:", e);
                    }
                }
                alert(`Resultado: Se sincronizaron ${enviados} de ${pendientes.length} registros con Kobo.`);
                actualizarInterfaz();
            };
        }
    </script>
</body>
</html>
