<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Racimos - Palma</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        button { padding: 15px 25px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; margin: 5px; }
        .btn-nfc { background-color: #27ae60; color: white; width: 100%; font-size: 18px; font-weight: bold; }
        .btn-sync { background-color: #2980b9; color: white; width: 100%; }
        .status { margin-top: 15px; font-weight: bold; color: #555; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h2>Control Cosecha de Palma</h2>

    <div class="card">
        <button class="btn-nfc" onclick="iniciarEscaneoNFC()">EFECTUAR LECTURA NFC</button>
        <div id="status-nfc" class="status">Estado: En espera de lectura...</div>
    </div>

    <div class="card">
        <h3>Resumen Local (Hoy)</h3>
        <p>Total racimos registrados sin enviar: <span id="total-pendientes">0</span></p>
        <button class="btn-sync" onclick="sincronizarConKobo()">SINCRONIZAR DATOS CON KOBO</button>
    </div>

    <div class="card">
        <h3>Conteo por Cortero</h3>
        <table id="tabla-resumen">
            <thead>
                <tr>
                    <th>ID Cortero</th>
                    <th>Racimos</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        // CONFIGURACIÓN DE KOBO
        const KOBO_ENDPOINT = "https://eu.kobotoolbox.org/api/v2/assets/a3M8LTcupevyFqnTnLYgLv/submissions.json";
        const KOBO_TOKEN = "Token a6e03ba3d149e0ca7f60fb55d2e5516ea0b85b07";

        let db;

        // Inicializar IndexedDB para guardar offline
        const request = indexedDB.open("CosechaPalmaDB", 1);
        request.onupgradeneeded = e => {
            db = e.target.result;
            db.createObjectStore("registros", { keyPath: "id", autoIncrement: true });
        };
        request.onsuccess = e => {
            db = e.target.result;
            actualizarInterfaz();
        };

        // 1. Lectura NFC
        async function iniciarEscaneoNFC() {
            const statusDiv = document.getElementById("status-nfc");
            if (!("NDEFReader" in window)) {
                statusDiv.innerText = "Error: Este navegador o dispositivo no soporta lectura NFC.";
                return;
            }

            try {
                const ndef = new NDEFReader();
                await ndef.scan();
                statusDiv.innerText = "Escaneando... Acerca la etiqueta del cortero.";

                ndef.onreading = event => {
                    const decoder = new TextDecoder();
                    let idCortero = "DESCONOCIDO";
                    for (const record of event.message.records) {
                        idCortero = decoder.decode(record.data);
                    }
                    statusDiv.innerText = `Tag detectado: ${idCortero}. Capturando GPS...`;
                    capturarUbicacionYGuardar(idCortero);
                };
            } catch (error) {
                statusDiv.innerText = "Error al activar NFC: " + error;
            }
        }

        // 2. Captura de GPS y Guardado Local
        function capturarUbicacionYGuardar(idCortero) {
            navigator.geolocation.getCurrentPosition(
                pos => {
                    const registro = {
                        id_cortero: idCortero,
                        latitud: pos.coords.latitude,
                        longitud: pos.coords.longitude,
                        cantidad: 1,
                        timestamp: new Date().toISOString(),
                        sincronizado: false
                    };
                    guardarEnBDLocal(registro);
                },
                err => {
                    // Si falla el GPS, guardar registro con ubicación nula
                    const registro = {
                        id_cortero: idCortero,
                        latitud: null,
                        longitud: null,
                        cantidad: 1,
                        timestamp: new Date().toISOString(),
                        sincronizado: false
                    };
                    guardarEnBDLocal(registro);
                },
                { enableHighAccuracy: true, timeout: 5000 }
            );
        }

        function guardarEnBDLocal(registro) {
            const tx = db.transaction("registros", "readwrite");
            const store = tx.objectStore("registros");
            store.add(registro);
            tx.oncomplete = () => {
                document.getElementById("status-nfc").innerText = `¡Registrado! Racimo contado para Cortero: ${registro.id_cortero}`;
                actualizarInterfaz();
            };
        }

        // 3. Resumen y Conteo en Pantalla
        function actualizarInterfaz() {
            const tx = db.transaction("registros", "readonly");
            const store = tx.objectStore("registros");
            const req = store.getAll();

            req.onsuccess = () => {
                const registros = req.result;
                document.getElementById("total-pendientes").innerText = registros.filter(r => !r.sincronizado).length;

                const conteo = {};
                registros.forEach(r => {
                    conteo[r.id_cortero] = (conteo[r.id_cortero] || 0) + 1;
                });

                const tbody = document.querySelector("#tabla-resumen tbody");
                tbody.innerHTML = "";
                for (const [cortero, total] of Object.entries(conteo)) {
                    tbody.innerHTML += `<tr><td>${cortero}</td><td>${total}</td></tr>`;
                }
            };
        }

        // 4. Sincronización con KoboToolbox cuando hay Internet
        async function sincronizarConKobo() {
            const tx = db.transaction("registros", "readwrite");
            const store = tx.objectStore("registros");
            const req = store.getAll();

            req.onsuccess = async () => {
                const pendientes = req.result.filter(r => !r.sincronizado);
                if (pendientes.length === 0) {
                    alert("No hay registros pendientes por enviar.");
                    return;
                }

                let enviados = 0;
                for (const item of pendientes) {
                    const koboPayload = {
                        "submission": {
                            "ID_CORTERO": item.id_cortero,
                            "UBICACION_GPS": `${item.latitud} ${item.longitud} 0 0`,
                            "CONTEO": item.cantidad,
                            "FECHA_HORA": item.timestamp
                        }
                    };

                    try {
                        const res = await fetch(KOBO_ENDPOINT, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "Authorization": KOBO_TOKEN
                            },
                            body: JSON.stringify(koboPayload)
                        });

                        if (res.ok) {
                            item.sincronizado = true;
                            store.put(item);
                            enviados++;
                        }
                    } catch (e) {
                        console.error("Fallo de red al enviar:", e);
                    }
                }
                alert(`Se sincronizaron ${enviados} de ${pendientes.length} registros con Kobo.`);
                actualizarInterfaz();
            };
        }
    </script>
</body>
</html>
